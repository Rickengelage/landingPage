<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Engelage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- header section -->
    <header>
        <div class="header-container">
        <div class="header-logo">
            <h1 class="logo">Rick Engelage</h1>
            </div>
        <div class="header-links">
            <ul class="links">
                <li>home</li>
                <li>Programs</li>
                <li>About</li>
            </ul>
        </div>
        </div>
    </header>
    <main>
 <!-- hero section -->
        <section class="hero-container">
            <div class="hero-text">
                <div class="title">
                    <h1>Lose the fat, Keep the Food</h1>
                </div>
                <div class="sub-text">
                    <p>you dont have to stop eating what u love, to get abs</p>
                </div>
                <div class="button">
                    <button>Learn more</button>
                </div>
            </div>
            <div class="hero-image">
                <img src="./images/heroimage.JPEG" alt="hero image">
            </div>
        </section>
<!-- programs section -->
        <section class="programs-container">
            <div class="title">
                <h1>Programs</h1>
            </div>
            <div class="programs-content">
                <div class="card">
                    <div class="image"><img src="./images/abs.JPEG" alt=""></div>
                    <div class="sub-text"><h4>simple abs</h4></div>
                </div>
                 <div class="card">
                    <div class="image"><img src="./images/recomp.JPEG" alt=""></div>
                    <div class="sub-text"><h4>simple recomp</h4></div>
                </div>
                 <div class="card">
                    <div class="image"><img src="./images/food.JPEG" alt=""></div>
                    <div class="sub-text"><h4>simple diet</h4></div>
                </div>
                 <div class="card">
                    <div class="image"><img src="./images/muscle.JPEG" alt=""></div>
                    <div class="sub-text"><h4>simple growth</h4></div>
                </div>
            </div>
            

        </section>

        <!-- quote section -->

        <section class="quote-container">
            <div class="quote">
                <p>pain is weakness leaving the body</p>
            </div>
            <div class="quote-source">
                <h3>-greg plitt</h3>
            </div>
        </section>

        <section class="action">
            <div class="title">
                <h1></h1>
            </div>
            <div class="sub-text">
                <p></p>
            </div>
            <div class="action-button">
                <button>Programs</button>
            </div>
        </section>
    </main>

    <footer class="footer">

    </footer>
</body>
</html>
